<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Protocol Explorer — протоколы прикладного уровня и мониторинга сети</title>
    <meta
      name="description"
      content="Интерактивные уроки по протоколам прикладного уровня: HTTP, HTTPS, HTTP/2, HTTP/3, DNS, DHCP, SMTP, POP3, IMAP, FTP, SSH, WebSocket, MQTT, SSE, gRPC, а также SNMP, NetFlow и Syslog (UDP и TCP). Каждый пакет разобран побайтно. На русском и английском."
    />
    <meta name="author" content="Dilum Sanjaya" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfdfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://yuryreznikau.github.io/protocol-explorer/" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- sharing: the card is public/og.png (drawn by scripts/brand-assets.mjs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Protocol Explorer" />
    <meta property="og:title" content="Protocol Explorer · Learn how the internet works" />
    <meta property="og:description" content="Watch the internet work, packet by packet: interactive lessons from DNS and TCP to TLS, with every packet decoded byte by byte." />
    <meta property="og:url" content="https://yuryreznikau.github.io/protocol-explorer/" />
    <meta property="og:image" content="https://yuryreznikau.github.io/protocol-explorer/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Protocol Explorer: a network diagram with a TLS Server Hello packet travelling from the internet to a laptop's router." />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@DilumSanjaya" />
    <meta name="twitter:title" content="Protocol Explorer · Learn how the internet works" />
    <meta name="twitter:description" content="Watch the internet work, packet by packet: interactive lessons from DNS and TCP to TLS, with every packet decoded byte by byte." />
    <meta name="twitter:image" content="https://yuryreznikau.github.io/protocol-explorer/og.png" />
    <meta name="twitter:image:alt" content="Protocol Explorer: a network diagram with a TLS Server Hello packet travelling from the internet to a laptop's router." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Protocol Explorer",
        "url": "https://yuryreznikau.github.io/protocol-explorer/",
        "description": "Interactive lessons on how internet protocols work, with every packet decoded byte by byte.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["ru", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Dilum Sanjaya", "url": "https://x.com/DilumSanjaya" }
      }
    </script>

    <script>
      // the theme, before anything is drawn: the one chosen last time, or the system's
      try {
        const saved = localStorage.getItem('protocol-explorer:theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (saved) for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = dark ? '#0b1020' : '#fdfdfe'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="margin: 40px; font: 16px/1.5 ui-monospace, monospace; color: #00238a">
        Protocol Explorer анимирует пакеты в сети, поэтому ему нужен JavaScript. Включите его, чтобы начать уроки. / Protocol Explorer needs JavaScript to animate the lessons.
      </p>
    </noscript>
  </body>
</html>
